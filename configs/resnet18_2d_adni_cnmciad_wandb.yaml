# Configuración de ejemplo para entrenar ResNet-18 2D en ADNI con CN/MCI/AD con logging de wandb

experiment:
  base_dir: './experiments'
  name: 'resnet18_2d_baseline_wandb'    # nombre del experimento

# Configuración de Weights & Biases
wandb:
  enabled: true
  project: 'pet-alzheimer-classification'  # Nombre del proyecto en wandb
  entity: null  # Tu usuario de wandb (opcional - déjalo null para usar por defecto)
  name: 'resnet18_2d_baseline'  # Nombre específico de este run
  tags: ['resnet18', '2d', 'adni', 'pet', 'alzheimer', 'baseline']
  notes: 'Entrenamiento de ResNet-18 2D para clasificación de Alzheimer con imágenes PET - Experimento baseline'
  group: 'resnet18_2d'  # Grupo para agrupar experimentos relacionados
  job_type: 'train'
  watch_model: true  # Para hacer track de gradientes y parámetros del modelo
  watch_freq: 100  # Frecuencia de logging de gradientes (cada N batches)
  log_frequency: 10  # Log cada N batches durante entrenamiento

model:
  name: 'resnet18'
  dimension: '2d'
  pretrained: true

data:
  dataset_name: 'ADNI'
  classes: 'CN_MCI_AD'
  dimension: '2d'
  data_dir: '/Volumes/Seagate/new_downloads/PET/converted_niftis'
  train_csv: './data/metadata/adni_train.csv'
  val_csv: './data/metadata/adni_val.csv'
  test_csv: './data/metadata/adni_test.csv'
  batch_size: 16
  num_workers: 4
  slice_selection: 'uniform'  # 'middle', 'all', 'uniform'
  num_slices: 16              # solo para 'uniform'
  
  augmentation:
    enabled: true
    rotate_degrees: 10
    scale_range: [0.9, 1.1]
    translate: [0.1, 0.1]

training:
  epochs: 50
  early_stopping_patience: 10
  
  optimizer:
    name: 'adam'
    lr: 0.0001
    weight_decay: 0.0001
  
  scheduler:
    name: 'reduce_on_plateau'
    mode: 'max'       # 'min' para pérdida, 'max' para AUC/precisión
    factor: 0.5       # factor de reducción
    patience: 5
  
  loss:
    name: 'cross_entropy'
    weighted: false
    class_weights: [1.0, 1.0, 1.0]  # pesos por clase para dataset desbalanceado
