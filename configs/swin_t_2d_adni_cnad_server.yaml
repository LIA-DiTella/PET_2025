# Configuración para entrenar Swin Transformer 2D en ADNI con CN/AD

experiment:
  base_dir: './experiments'
  name: 'swin_transformer_2d_baseline'

# Configuración de Weights & Biases
wandb:
  enabled: true
  project: 'PET'
  entity: pardo
  name: 'swin_t_2d_adni_cn_ad'
  tags: ['swin_transformer', '2d', 'adni', 'pet', 'alzheimer', "cn_ad"]
  notes: 'Entrenamiento de Swin Transformer 2D para clasificación de Alzheimer con imágenes PET'
  group: 'swin_transformer'
  job_type: 'train'
  watch_model: true
  watch_freq: 100
  log_frequency: 1

model:
  name: 'swin_transformer'
  variant: 'swin_t'  # 'swin_t', 'swin_s', 'swin_b', 'swin_v2_t', 'swin_v2_s', 'swin_v2_b'
  dimension: '2d'
  num_classes: 2
  pretrained: true
  feature_extract: false
  dropout_rate: 0.4

data:
  dataset_name: 'ADNI'
  classes: 'CN_AD'
  dimension: '2d'
  data_dir: './data/NIFTIs/Archivo/converted_niftis/'
  train_csv: './data/metadata/adni_train.csv'
  val_csv: './data/metadata/adni_val.csv'
  test_csv: './data/metadata/adni_test.csv'
  batch_size: 4
  num_workers: 1
  slice_selection: 'middle'
  num_slices: 16
  resample: true
  output_size: [224, 224]
  channels: 3

  augmentation:
    enabled: false

training:
  epochs: 50
  early_stopping_patience: 10
  
  optimizer:
    name: 'adam'
    lr: 0.00001
    weight_decay: 0.0001
  
  scheduler:
    name: 'reduce_on_plateau'
    mode: 'max'
    factor: 0.5
    patience: 5
  
  loss:
    name: 'cross_entropy'
    weighted: true
    class_weights: [1.0, 1.0]
