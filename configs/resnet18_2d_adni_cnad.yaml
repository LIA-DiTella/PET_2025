# Configuración de ejemplo para entrenar ResNet-18 2D en ADNI con CN/AD

experiment:
  base_dir: './experiments'
  name: 'baseline'    # nombre opcional del experimento

model:
  name: 'resnet18'
  dimension: '2d'
  pretrained: true

data:
  dataset_name: 'ADNI'
  classes: 'CN_AD'
  dimension: '2d'
  data_dir: './data/processed'
  train_csv: './data/metadata/adni_train.csv'
  val_csv: './data/metadata/adni_val.csv'
  test_csv: './data/metadata/adni_test.csv'
  batch_size: 32
  num_workers: 4
  slice_selection: 'middle'  # 'middle', 'all', 'uniform'
  num_slices: 1              # solo para 'uniform'
  
  augmentation:
    enabled: true
    rotate_degrees: 10
    scale_range: [0.9, 1.1]
    translate: [0.1, 0.1]

training:
  epochs: 100
  early_stopping_patience: 10
  
  optimizer:
    name: 'adam'
    lr: 0.0001
    weight_decay: 0.0001
  
  scheduler:
    name: 'reduce_on_plateau'
    mode: 'max'       # 'min' para pérdida, 'max' para AUC/precisión
    factor: 0.5       # factor de reducción
    patience: 5
  
  loss:
    name: 'cross_entropy'
    weighted: false
    class_weights: [1.0, 1.0]  # pesos por clase para dataset desbalanceado
