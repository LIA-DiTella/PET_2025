# Configuración de ejemplo para entrenar ViT 3D en ADNI con CN/MCI/AD

experiment:
  base_dir: './experiments'
  name: 'transformer_3d'

model:
  name: 'vit'
  dimension: '3d'
  vol_size: 96
  patch_size: 16
  embed_dim: 512
  depth: 8
  num_heads: 8

data:
  dataset_name: 'ADNI'
  classes: 'CN_MCI_AD'
  dimension: '3d'
  data_dir: './data/processed'
  train_csv: './data/metadata/adni_train.csv'
  val_csv: './data/metadata/adni_val.csv'
  test_csv: './data/metadata/adni_test.csv'
  batch_size: 4       # Batch size pequeño para ViT 3D (alto consumo de memoria)
  num_workers: 4
  target_shape: [96, 96, 96]
  
training:
  epochs: 100
  early_stopping_patience: 15
  
  optimizer:
    name: 'adamw'
    lr: 0.00005
    weight_decay: 0.01
  
  scheduler:
    name: 'cosine_annealing'
    t_max: 100
    eta_min: 0.000001
  
  loss:
    name: 'cross_entropy'
    weighted: true
    class_weights: [1.0, 0.6, 1.2]  # Pesos para CN, MCI, AD
