# Configuración base para entrenar InceptionV3 3D en ADNI con CN/AD

experiment:
  base_dir: './experiments'
  name: 'baseline'

# Configuración de Weights & Biases
wandb:
  enabled: true
  project: 'PET'
  entity: pardo
  name: 'inceptionv3_3d_adni_cn_ad'
  tags: ['inceptionv3', '3d', 'adni', 'pet', 'alzheimer', "cn_ad"]
  notes: 'Entrenamiento de InceptionV3 3D para clasificación de Alzheimer con imágenes PET'
  group: 'inceptionv3_3d'
  job_type: 'train'
  watch_model: true
  watch_freq: 100
  log_frequency: 1

model:
  name: 'inceptionv3'
  dimension: '3d'
  pretrained: false  # No hay modelos preentrenados 3D
  feature_extract: false
  dropout_rate: 0.0

data:
  dataset_name: 'ADNI'
  classes: 'CN_AD'
  dimension: '3d'
  data_dir: './data/NIFTIs/Archivo/converted_niftis/'
  train_csv: './data/metadata/adni_train.csv'
  val_csv: './data/metadata/adni_val.csv'
  test_csv: './data/metadata/adni_test.csv'
  batch_size: 2  # Batch size más pequeño para 3D
  num_workers: 1
  slice_selection: 'middle'
  num_slices: 16
  resample: true
  output_size: [299, 299]  # Mantenemos el tamaño requerido por InceptionV3

  augmentation:
    enabled: false

training:
  epochs: 50
  early_stopping_patience: 1
  
  optimizer:
    name: 'adam'
    lr: 0.0001
    weight_decay: 0.0001
  
  scheduler:
    name: 'reduce_on_plateau'
    mode: 'max'
    factor: 0.5
    patience: 5
  
  loss:
    name: 'cross_entropy'
    weighted: true
    class_weights: [1.0, 1.0]
